var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

:root{

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{

  background:var(--canvas);
  color:var(--ink);

}
.serif{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--brass-light);}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:232px;flex-shrink:0;background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#EDE9DC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.sidebar-brand{padding:26px 22px 18px;border-bottom:1px solid rgba(237,233,220,0.08);}
.sidebar-brand .kicker{font-size:11px;letter-spacing:0.06em;color:var(--brass-light);margin-bottom:4px;}
.sidebar-brand .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;line-height:1.25;color:#F7F4EA;}
.nav{padding:14px 12px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:8px;margin-bottom:2px;
  color:#C9C6BB;font-size:14px;font-weight:500;transition:background .15s ease, color .15s ease;
}
.nav-item svg{flex-shrink:0;opacity:0.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#F3F0E6;}
.nav-item.active{background:rgba(184,146,90,0.18);color:#F7EFDF;}
.nav-item.active svg{opacity:1;}
.nav-cta{
  margin:10px 12px 18px;padding:12px 14px;border-radius:9px;border:1px solid rgba(184,146,90,0.5);
  background:linear-gradient(135deg,var(--brass) 0%, #9C7746 100%);color:#1A1206;font-weight:700;font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0.01em;
  box-shadow:0 6px 16px rgba(184,146,90,0.28);
}
.nav-cta:hover{filter:brightness(1.06);}
.sidebar-foot{padding:16px 22px 20px;font-size:11.5px;color:#8D93A0;border-top:1px solid rgba(237,233,220,0.08);}

.main{flex:1;min-width:0;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:20px 32px;
  background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
}
.topbar h1{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin:0;}
.topbar .sub{font-size:13px;color:var(--slate);margin-top:2px;}
.content{padding:28px 32px 60px;max-width:1240px;}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:8px;
  font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:all .15s ease;
}
.btn:hover{border-color:#CFC7AE;background:#FAF8F2;}
.btn-primary{
  background:var(--navy);border-color:var(--navy);color:#F5F2E7;
}
.btn-primary:hover{background:var(--navy-2);}
.btn-brass{
  background:linear-gradient(135deg,var(--brass) 0%, #9C7746 100%);border-color:transparent;color:#1A1206;
}
.btn-brass:hover{filter:brightness(1.05);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--slate);}

.btn-danger{color:var(--rust);border-color:#EAD3CC;background:#fff;}
.btn-danger:hover{background:var(--rust-bg);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-block{width:100%;justify-content:center;}
.icon-btn{width:32px;height:32px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--slate);}
.icon-btn:hover{background:#F5F2E7;color:var(--ink);}

/* ---------- Cards / grid ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}

.stat-card{padding:18px 18px 16px;position:relative;overflow:hidden;}
.stat-card .label{font-size:12px;color:var(--slate);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}
.stat-card .value{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin-top:8px;color:var(--ink);}
.stat-card .value.small{font-size:22px;}
.stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
.stat-card.acc-brass .bar{background:var(--brass);}
.stat-card.acc-success .bar{background:var(--success);}
.stat-card.acc-amber .bar{background:var(--amber);}
.stat-card.acc-rust .bar{background:var(--rust);}
.stat-card.acc-navy .bar{background:var(--navy);}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0;}
.section-head .muted{font-size:13px;color:var(--slate);}

select, .select-like{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--ink);
}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:6px;}

  width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink);background:#fff;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(184,146,90,0.15);}
.field .hint{font-size:11.5px;color:var(--slate-light);margin-top:4px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.currency-input{position:relative;}
.currency-input .rupee{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--slate);font-size:14px;}
.currency-input input{padding-left:26px;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:500;}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;}
table.data th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.045em;color:var(--slate);
  font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:#FAF8F2;white-space:nowrap;
}
table.data td{padding:12px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
table.data tr:last-child td{border-bottom:none;}
table.data tr:hover td{background:#FBF9F3;}
td.num, th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
.empty-row td{text-align:center;padding:40px;color:var(--slate-light);font-family:'Inter';white-space:normal;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:11.5px;font-weight:700;letter-spacing:0.02em;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;}
.badge.paid{background:var(--success-bg);color:var(--success);}

.badge.partial{background:var(--amber-bg);color:var(--amber);}
.badge.partial::before{background:var(--amber);}
.badge.pending{background:var(--rust-bg);color:var(--rust);}
.badge.pending::before{background:var(--rust);}

.action-row{display:flex;gap:5px;}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,27,38,0.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;}

<script>
/* =========================================================================
   RENTAL BILLING MANAGEMENT — app logic
   ========================================================================= */

/* ---------------------------- Utilities ------------------------------- */
function num(v){ const n = parseFloat(v); if(isNaN(n) || !isFinite(n) || n<0) return 0; return n; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad3(n){ return String(n).padStart(3,'0'); }
function inr(n){
  n = num(n);
  try{ return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n); }
  catch(e){ return '₹'+Math.round(n).toString(); }
}
function inrPlain(n){ return inr(n).replace('₹','₹ '); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function currentMonthKey(){ const d=new Date(); return d.getFullYear()+'-'+pad3(d.getMonth()+1).slice(1); }
function monthKeyFromDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){
  if(!key) return '';
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString('en-IN',{month:'long', year:'numeric'});
}
function monthLabelShort(key){
  if(!key) return '';
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleDateString('en-IN',{month:'short', year:'numeric'});
}
function firstDayOfMonth(key){ return `${key}-01`; }
function lastDayOfMonth(key){
  const [y,m]=String(key).split('-').map(Number);
  return `${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
}
function formatBillingPeriod(from,to){
  if(!from || !to) return '';
  return `${fmtDateDMY(from)} – ${fmtDateDMY(to)}`;
}
function fmtDateDMY(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function addDays(iso, days){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+ (days||0));
  return d.toISOString().slice(0,10);
}
function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function makeUpiQrDataUrl(text){
  try{
    if(typeof qrcode==='undefined') return '';
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr.createDataURL(6, 8);
  }catch(e){
    console.error('QR generation failed', e);
    return '';
  }
}
// PNG (not GIF) QR data URL, drawn on a plain <canvas> — jsPDF's addImage() only
// reliably accepts JPEG/PNG/WEBP, so for embedding directly in the exported PDF we
// draw the QR ourselves instead of reusing the library's createDataURL() GIF output.
function makeUpiQrPngDataUrl(text, cellSize, margin){
  cellSize = cellSize || 6; margin = margin || 8;
  try{
    if(typeof qrcode==='undefined') return '';
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const count = qr.getModuleCount();
    const size = count*cellSize + margin*2;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,size,size);
    ctx.fillStyle = '#000000';
    for(let r=0;r<count;r++){
      for(let c=0;c<count;c++){
        if(qr.isDark(r,c)) ctx.fillRect(margin + c*cellSize, margin + r*cellSize, cellSize, cellSize);
      }
    }
    return canvas.toDataURL('image/png');
  }catch(e){
    console.error('QR PNG generation failed', e);
    return '';
  }
}
// Single source of truth for a bill's UPI payment link — used by BOTH the on-screen
// preview and the PDF export, so the "Pay Now" button, the QR code, and the exported
// PDF's link always point at the exact same dynamically-built URI. Nothing here is
// hardcoded: pa comes from Settings, am/tn come straight from the bill object.
function getBillPaymentInfo(b){
  const s = DB.settings;
  if(!s.upiId || !b) return null;
  const amount = num(b.balance) > 0 ? num(b.balance) : num(b.total);
  const payeeName = s.propertyName || s.ownerName || 'Rental Billing';
  const upiUri = `upi://pay?pa=${encodeURIComponent(s.upiId)}&pn=${encodeURIComponent(payeeName)}&am=${encodeURIComponent(amount.toFixed(2))}&cu=INR&tn=${encodeURIComponent(b.billNo)}`;
  return { upiUri, amount, invoiceId: b.billNo, upiId: s.upiId, payeeName };
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 2400);
}

/* ---------------------------- State ------------------------------------ */
const DEFAULT_SETTINGS = {
  propertyName: 'I-103, BETA 2',
  address: '',
  ownerName: '',
  managerName: '',
  managerPhone: '',
  upiId: '9232698634@axl',
  bankDetails: '',
  dueDateDays: 7,
  paymentInstructions: 'Please pay via UPI and share the transaction ID for quick confirmation.',
  elecRatePerUnit: 8.5
};

var DB = {
  tenants: [],
  bills: [],
  settings: {...DEFAULT_SETTINGS},
  counters: { billSeq:{}, receiptSeq:{} }
};

var UI = {
  ready:false,
  view:'dashboard',
  dashboardMonth: currentMonthKey(),
  tenantModal:null,        // { mode:'add'|'edit', id:null }
  wizard:null,
  previewBillId:null,
  previewMode:null,        // 'bill' | 'receipt'
  billsSearch:'',
  billsStatus:'all',
  reportsMonth: currentMonthKey(),
  confirmDelete:null,      // tenant id pending delete confirmation
  confirmClearAll:false    // whether the "clear all data" confirmation is open
};

/* ---------------------------- Persistence ------------------------------ */
/* Tries Claude's artifact storage first (when viewed inside Claude); falls back
   to the browser's own localStorage so records are always saved even when this
   file is downloaded and opened directly in a browser. This guarantees every
   tenant's every month's bill history stays safe no matter how the file is used. */
const LOCAL_KEY_PREFIX = 'rentalBillingDashboard_';

/* ---------------------------- Supabase Cloud ---------------------------- */
const SUPABASE_URL = 'https://plgacupyoeqlcnmmylbi.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_zQkRiguAM1tXRC-_y1qjYw_0P3iPlWo';
const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
let CLOUD_USER = null;
let CLOUD_SYNCING = false;
let CLOUD_LAST_SYNC = null;
let CLOUD_POLL_TIMER = null;
let CLOUD_REALTIME_CHANNEL = null;

function getCloudRole(){
  return (CLOUD_USER?.user_metadata?.role || CLOUD_USER?.raw_user_meta_data?.role || 'owner').toLowerCase();
}
function isAdmin(){ return !!CLOUD_USER && ['admin','owner'].includes(getCloudRole()); }
function isOwner(){ return !!CLOUD_USER && getCloudRole()==='owner'; }
function requireAdmin(action='perform this action'){
  if(!isAdmin()){ toast('You must be signed in to '+action+'.'); return false; }
  return true;
}

function hasArtifactStorage(){
  return typeof window!=='undefined' && window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function';
}
async function storageGet(key, fallback){
  if(hasArtifactStorage()){
    try{
      const r = await window.storage.get(key, false);
      if(r && typeof r.value === 'string'){ return JSON.parse(r.value); }
    }catch(e){ /* fall through */ }
  }
  try{
    const raw = localStorage.getItem(LOCAL_KEY_PREFIX+key);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* localStorage unavailable or corrupted */ }
  return fallback;
}
async function storageSet(key, value){
  let artifactOk = true;
  if(hasArtifactStorage()){
    try{ await window.storage.set(key, JSON.stringify(value), false); }
    catch(e){ artifactOk = false; console.error('artifact storage set failed', key, e); }
  }
  try{ localStorage.setItem(LOCAL_KEY_PREFIX+key, JSON.stringify(value)); }
  catch(e){
    console.error('localStorage set failed', key, e);
    if(!artifactOk) toast('Could not save locally — please retry.');
  }
}

function localSnapshot(){
  return {
    tenants: DB.tenants || [],
    bills: DB.bills || [],
    settings: DB.settings || {...DEFAULT_SETTINGS},
    counters: DB.counters || {billSeq:{}, receiptSeq:{}}
  };
}
function snapshotHasData(d){
  if(!d) return false;
  return (Array.isArray(d.tenants) && d.tenants.length>0) ||
         (Array.isArray(d.bills) && d.bills.length>0) ||
         (d.settings && JSON.stringify(d.settings)!==JSON.stringify(DEFAULT_SETTINGS)) ||
         !!(d.counters && ((d.counters.billSeq && Object.keys(d.counters.billSeq).length) || (d.counters.receiptSeq && Object.keys(d.counters.receiptSeq).length)));
}
function applySnapshot(d){
  DB.tenants = Array.isArray(d?.tenants) ? d.tenants : [];
  DB.bills = Array.isArray(d?.bills) ? d.bills : [];
  DB.settings = {...DEFAULT_SETTINGS, ...(d?.settings||{})};
  DB.counters = d?.counters || {billSeq:{}, receiptSeq:{}};
  if(!DB.counters.billSeq) DB.counters.billSeq = {};
  if(!DB.counters.receiptSeq) DB.counters.receiptSeq = {};
}
async function cloudFetchRow(){
  if(!supabaseClient || !CLOUD_USER) return null;
  const {data,error} = await supabaseClient.from('rental_data').select('id,data,updated_at').eq('id',1).maybeSingle();
  if(error) throw error;
  return data || null;
}
async function cloudSaveSnapshot(){
  if(!supabaseClient || !CLOUD_USER || !isAdmin()) return false;
  const payload = localSnapshot();
  CLOUD_SYNCING = true;
  try{
    const {error} = await supabaseClient.from('rental_data').upsert({
      id: 1,
      data: payload,
      updated_at: new Date().toISOString()
    }, {onConflict:'id'});
    if(error) throw error;
    CLOUD_LAST_SYNC = Date.now();
    return true;
  }catch(e){
    console.error('Cloud save failed:', e);
    toast('Cloud sync failed — data is still saved on this device.');
    return false;
  }finally{
    CLOUD_SYNCING = false;
  }
}
async function cloudLoadOrSeed(){
  if(!supabaseClient || !CLOUD_USER) return;
  try{
    const remote = await cloudFetchRow();
    const local = localSnapshot();
    if(remote && remote.data){
      /* Cloud is the shared source of truth once a shared row exists. */
      applySnapshot(remote.data);
      CLOUD_LAST_SYNC = remote.updated_at ? new Date(remote.updated_at).getTime() : Date.now();
      await Promise.all([
        storageSet('tenants', DB.tenants),
        storageSet('bills', DB.bills),
        storageSet('settings', DB.settings),
        storageSet('counters', DB.counters)
      ]);
    }else if(snapshotHasData(local)){
      await cloudSaveSnapshot();
    }else{
      await cloudSaveSnapshot();
    }
  }catch(e){
    console.error('Cloud load failed:', e);
    toast('Could not reach cloud. Local data will be used.');
  }
}
async function pollCloud(){
  if(!CLOUD_USER || CLOUD_SYNCING || UI.view==='wizard' || UI.tenantModal || UI.previewBillId) return;
  try{
    const remote = await cloudFetchRow();
    if(!remote || !remote.updated_at) return;
    const remoteTime = new Date(remote.updated_at).getTime();
    if(CLOUD_LAST_SYNC && remoteTime > CLOUD_LAST_SYNC + 500){
      applySnapshot(remote.data || {});
      CLOUD_LAST_SYNC = remoteTime;
      await Promise.all([
        storageSet('tenants', DB.tenants),
        storageSet('bills', DB.bills),
        storageSet('settings', DB.settings),
        storageSet('counters', DB.counters)
      ]);
      UI.dashboardMonth = monthsWithData()[0] || currentMonthKey();
      render();
      toast('Updated data synced from cloud.');
    }
  }catch(e){ console.warn('Cloud polling failed:', e); }
}
function startCloudPolling(){
  clearInterval(CLOUD_POLL_TIMER);
  CLOUD_POLL_TIMER = setInterval(pollCloud, 8000);
}

function cloudLastSyncLabel(){
  if(!CLOUD_LAST_SYNC) return 'Last sync: —';
  try{ return 'Last sync: ' + new Date(CLOUD_LAST_SYNC).toLocaleString([], {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'short'}); }
  catch(e){ return 'Last sync: just now'; }
}

async function cloudSyncNow(btn){
  if(!CLOUD_USER || !supabaseClient) return;
  if(CLOUD_SYNCING) return;
  const oldText = btn ? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='Syncing…'; }
  try{
    const remote = await cloudFetchRow();
    if(!remote){
      await cloudSaveSnapshot();
      toast('Cloud sync complete.');
    }else{
      const remoteTime = remote.updated_at ? new Date(remote.updated_at).getTime() : 0;
      if(remote.data && (!CLOUD_LAST_SYNC || remoteTime > CLOUD_LAST_SYNC + 200)){
        applySnapshot(remote.data);
        CLOUD_LAST_SYNC = remoteTime || Date.now();
        await Promise.all([
          storageSet('tenants', DB.tenants),
          storageSet('bills', DB.bills),
          storageSet('settings', DB.settings),
          storageSet('counters', DB.counters)
        ]);
        UI.dashboardMonth = monthsWithData()[0] || currentMonthKey();
        if(UI.ready) render();
        toast('Latest cloud data synced.');
      }else{
        CLOUD_LAST_SYNC = remoteTime || CLOUD_LAST_SYNC || Date.now();
        toast('Already up to date.');
        if(UI.ready) render();
      }
    }
  }catch(e){
    console.error('Manual cloud sync failed:', e);
    toast('Sync failed — please check your internet connection.');
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=oldText || '↻ Sync Now'; }
  }
}

async function handleRealtimeCloudChange(payload){
  if(!CLOUD_USER || CLOUD_SYNCING) return;
  const row = payload?.new;
  if(!row || row.id !== 1 || !row.data) return;
  const remoteTime = row.updated_at ? new Date(row.updated_at).getTime() : Date.now();
  if(CLOUD_LAST_SYNC && remoteTime <= CLOUD_LAST_SYNC + 200) return;
  applySnapshot(row.data);
  CLOUD_LAST_SYNC = remoteTime;
  await Promise.all([
    storageSet('tenants', DB.tenants),
    storageSet('bills', DB.bills),
    storageSet('settings', DB.settings),
    storageSet('counters', DB.counters)
  ]);
  UI.dashboardMonth = monthsWithData()[0] || currentMonthKey();
  if(UI.ready) render();
  toast('Updated data synced instantly from cloud.');
}

function startCloudRealtime(){
  if(!supabaseClient || !CLOUD_USER) return;
  if(CLOUD_REALTIME_CHANNEL){
    try{ supabaseClient.removeChannel(CLOUD_REALTIME_CHANNEL); }catch(e){}
    CLOUD_REALTIME_CHANNEL = null;
  }
  CLOUD_REALTIME_CHANNEL = supabaseClient
    .channel('rental-data-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rental_data', filter: 'id=eq.1' }, handleRealtimeCloudChange)
    .subscribe((status) => {
      console.log('Rental Billing realtime status:', status);
    });
}

function stopCloudRealtime(){
  if(CLOUD_REALTIME_CHANNEL){
    try{ supabaseClient.removeChannel(CLOUD_REALTIME_CHANNEL); }catch(e){}
    CLOUD_REALTIME_CHANNEL = null;
  }
}

/* ---------------------------- Backup / Restore -------------------------- */
function exportBackup(){
  const backup = { tenants:DB.tenants, bills:DB.bills, settings:DB.settings, counters:DB.counters, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Rental-Billing-Backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup file downloaded.');
}
function triggerImportBackup(){ document.getElementById('backupFileInput').click(); }
async function importBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.tenants) || !Array.isArray(data.bills)){
      toast('This does not look like a valid backup file.');
      return;
    }
    DB.tenants = data.tenants || [];
    DB.bills = data.bills || [];
    DB.settings = {...DEFAULT_SETTINGS, ...(data.settings||{})};
    DB.counters = data.counters || { billSeq:{}, receiptSeq:{} };
    await Promise.all([saveTenants(), saveBills(), saveSettings(), saveCounters()]);
    toast('Backup restored successfully.');
    UI.dashboardMonth = monthsWithData()[0] || currentMonthKey();
    render();
  }catch(e){
    console.error(e);
    toast('Could not read that backup file.');
  }
  input.value = '';
}


/* ---------------------------- Derived helpers --------------------------- */
function calcTotal(c){
  return num(c.rent) + num(c.electricity) + num(c.maintenance) + num(c.png) + num(c.other) - num(c.discount);
}
function calcStatus(total, paid){
  paid = num(paid); total = num(total);
  if(paid <= 0) return 'PENDING';
  if(paid >= total) return 'PAID';
  return 'PARTIALLY PAID';
}
function statusClass(status){
  if(status==='PAID') return 'paid';
  if(status==='PARTIALLY PAID') return 'partial';
  return 'pending';
}
function genBillNo(monthKey){
  DB.counters.billSeq[monthKey] = (DB.counters.billSeq[monthKey]||0) + 1;
  return `BILL-${monthKey}-${pad3(DB.counters.billSeq[monthKey])}`;
}
function genReceiptNo(monthKey){
  DB.counters.receiptSeq[monthKey] = (DB.counters.receiptSeq[monthKey]||0) + 1;
  return `REC-${monthKey}-${pad3(DB.counters.receiptSeq[monthKey])}`;
}
function getTenant(id){ return DB.tenants.find(t=>t.id===id); }
function getBill(id){ return DB.bills.find(b=>b.id===id); }
function findBillForTenantMonth(tenantId, month, excludeId){
  return DB.bills.find(b=>b.tenantId===tenantId && b.month===month && b.id!==excludeId);
}
function findBillForTenantPeriod(tenantId, from, to, excludeId){
  return DB.bills.find(b=>{
    if(b.id===excludeId || b.tenantId!==tenantId) return false;
    const bf = b.periodFrom || firstDayOfMonth(b.month);
    const bt = b.periodTo || lastDayOfMonth(b.month);
    return bf===from && bt===to;
  });
}
function billsForMonth(month){ return DB.bills.filter(b=>b.month===month); }
function monthsWithData(){
  const s = new Set([currentMonthKey()]);
  DB.bills.forEach(b=>s.add(b.month));
  return Array.from(s).sort().reverse();
}

async function saveTenantForm(id){
  const floor = document.getElementById('f_floor').value.trim();
  const flat = document.getElementById('f_flat').value.trim();
  const name = document.getElementById('f_name').value.trim();
  const mobile = document.getElementById('f_mobile').value.trim();
  const rent = num(document.getElementById('f_rent').value);
  const notes = document.getElementById('f_notes').value.trim();
  if(!flat || !name){ toast('Flat number and tenant name are required.'); return; }
  if(id){
    const t = getTenant(id);
    Object.assign(t, {floor, flat, name, mobile, rent, notes});
    DB.bills.forEach(b=>{ if(b.tenantId===id){ b.tenantName = name; b.flat = flat; b.floor = floor; } });
    await Promise.all([saveTenants(), saveBills()]);
    toast('Tenant updated.');
  } else {
    DB.tenants.push({ id: uid(), floor, flat, name, mobile, rent, notes, createdAt: Date.now() });
    await saveTenants();
    toast('Tenant added.');
  }
  UI.tenantModal = null;
  render();
}
function askDeleteTenant(id){ if(!requireAdmin('delete a tenant')) return; UI.confirmDelete = id; render(); }
function renderConfirmDeleteModal(){
  const t = getTenant(UI.confirmDelete);

  return `

      </div>

/* ============================== QUICK PAYMENT (Payment Done) =============================== */
function openPaymentModal(billId){
  if(!requireAdmin('record a payment')) return;
  const b = getBill(billId);
  if(!b) return;
  const due = Math.max(num(b.total) - num(b.amountPaid), 0);
  UI.paymentModal = {
    billId,
    amount: due || num(b.total),
    date: todayISO(),
    method: b.paymentMethod || 'UPI',
    txn: ''
  };
  render();
}
function closePaymentModal(){ UI.paymentModal = null; render(); }
function renderPaymentModal(){
  const p = UI.paymentModal;
  const b = getBill(p.billId);
  if(!b){ UI.paymentModal = null; return ''; }
  const alreadyPaid = num(b.amountPaid);
  const due = Math.max(num(b.total) - alreadyPaid, 0);
  return `
  <div class="overlay" onclick="if(event.target===this) closePaymentModal();">
    <div class="modal">

      <div class="modal-body">
        <p style="margin:0 0 14px;font-size:13.5px;color:var(--slate);">
          Recording payment for <strong>${esc(b.tenantName)}</strong> — Flat ${esc(b.flat)}, ${esc(formatBillingPeriod(b.periodFrom || firstDayOfMonth(b.month), b.periodTo || lastDayOfMonth(b.month)))}.
        </p>
        <div class="calc-line"><span>Bill Total</span><span class="amt">${inr(b.total)}</span></div>
        ${alreadyPaid>0 ? `<div class="calc-line"><span>Already Paid</span><span class="amt">${inr(alreadyPaid)}</span></div>` : ''}

        <div class="field" style="margin-top:14px;">
          <label>Amount Received Now</label>
          <div class="currency-input"><span class="rupee">₹</span><input id="pm_amount" value="${p.amount}" oninput="UI.paymentModal.amount=this.value;" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Payment Date</label><input type="date" id="pm_date" value="${p.date}" onchange="UI.paymentModal.date=this.value;" /></div>
          <div class="field"><label>Payment Method</label>
            <select id="pm_method" onchange="UI.paymentModal.method=this.value;">
              ${['UPI','Cash','Bank Transfer','Other'].map(m=>`<option ${p.method===m?'selected':''}>${m}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field"><label>Transaction / Reference ID</label><input id="pm_txn" value="${esc(p.txn)}" placeholder="Optional" oninput="UI.paymentModal.txn=this.value;" /></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closePaymentModal()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmPaymentDone()">${icon('check',15)} Mark Payment Done</button>
      </div>
    </div>
  </div>`;
}
async function confirmPaymentDone(){
  const p = UI.paymentModal;
  const b = getBill(p.billId);
  if(!b) { UI.paymentModal = null; render(); return; }
  const newlyReceived = num(p.amount);
  if(newlyReceived <= 0){ toast('Enter a valid amount received.'); return; }
  b.amountPaid = num(b.amountPaid) + newlyReceived;
  b.paymentDate = p.date;
  b.paymentMethod = p.method;
  b.transactionId = p.txn || b.transactionId || '';
  b.balance = Math.max(num(b.total) - num(b.amountPaid), 0);
  b.status = calcStatus(b.total, b.amountPaid);
  UI.paymentModal = null;
  await saveBills();
  toast(b.status==='PAID' ? 'Payment recorded — bill marked as PAID.' : 'Partial payment recorded.');
  render();
}

/* ============================== BILL WIZARD =============================== */
function openWizard(billId){
  if(!requireAdmin(billId ? 'edit a bill' : 'create a bill')) return;
  if(DB.tenants.length===0){
    toast('Add a tenant first, then create a bill.');
    UI.view = 'tenants';
    render();
    return;
  }
  if(billId){
    const b = getBill(billId);
    UI.wizard = {
      step:1, editingBillId: b.id, tenantId: b.tenantId, month: b.month,
      periodFrom: b.periodFrom || firstDayOfMonth(b.month), periodTo: b.periodTo || lastDayOfMonth(b.month),
      billDate: b.billDate, dueDate: b.dueDate,
      rent:b.rent, electricity:b.electricity, maintenance:b.maintenance, png:b.png, other:b.other, discount:b.discount,
      prevUnit: b.prevUnit!==undefined ? b.prevUnit : 0,
      currUnit: b.currUnit!==undefined ? b.currUnit : 0,
      elecRate: b.elecRate!==undefined ? b.elecRate : (DB.settings.elecRatePerUnit||8.5),
      amountPaid:b.amountPaid, paymentDate:b.paymentDate||todayISO(), paymentMethod:b.paymentMethod||'UPI', transactionId:b.transactionId||''
    };
  } else {
    const month = UI.dashboardMonth || currentMonthKey();
    UI.wizard = {
      step:1, editingBillId:null, tenantId:'', month,
      periodFrom: firstDayOfMonth(month), periodTo: lastDayOfMonth(month),
      billDate: todayISO(), dueDate: addDays(todayISO(), DB.settings.dueDateDays||7),
      rent:0, electricity:0, maintenance:0, png:0, other:0, discount:0,
      prevUnit:0, currUnit:0, elecRate: DB.settings.elecRatePerUnit||8.5,
      amountPaid:0, paymentDate: todayISO(), paymentMethod:'UPI', transactionId:''
    };
  }
  UI.view = 'wizard';
  render();
}
function closeWizard(){ UI.wizard = null; UI.view='dashboard'; render(); }
function wizardGoStep(n){ UI.wizard.step = n; render(); }

function onWizardTenantChange(sel){
  const tenant = getTenant(sel.value);
  UI.wizard.tenantId = sel.value;
  if(tenant && !UI.wizard.editingBillId){ UI.wizard.rent = tenant.rent; }
  render();
}
function onWizardField(el, field, type){
  if(type==='num'){ UI.wizard[field] = num(el.value); updateWizardTotals(); }
  else { UI.wizard[field] = el.value; }
}
function onWizardElecInput(el, field){
  UI.wizard[field] = num(el.value);
  const w = UI.wizard;
  const units = Math.max(num(w.currUnit) - num(w.prevUnit), 0);
  const rate = num(w.elecRate) || (DB.settings.elecRatePerUnit||8.5);
  const unitsEl = document.getElementById('wizUnitsValue');
  const rateEl = document.getElementById('wizRateValue');
  const amtEl = document.getElementById('wizElecCalcValue');
  if(unitsEl) unitsEl.textContent = units;
  if(rateEl) rateEl.textContent = rate;
  if(amtEl) amtEl.textContent = inr(units*rate);
}
function applyElecCalc(){
  const w = UI.wizard;
  const units = Math.max(num(w.currUnit) - num(w.prevUnit), 0);
  const rate = num(w.elecRate) || (DB.settings.elecRatePerUnit||8.5);
  const amount = Math.round(units*rate);
  w.electricity = amount;
  const elecInput = document.getElementById('wiz_electricity');
  if(elecInput) elecInput.value = amount;
  updateWizardTotals();
  toast(`Electricity set to ₹${amount} for ${units} units.`);
}
function updateWizardTotals(){
  const w = UI.wizard;
  const total = calcTotal(w);
  const totalEl = document.getElementById('wizTotalValue');
  if(totalEl) totalEl.textContent = inr(total);
  ['rent','electricity','maintenance','png','other','discount'].forEach(f=>{
    const el = document.getElementById('calc_'+f);
    if(el) el.textContent = (f==='discount' ? '– ' : '') + inr(w[f]);
  });
  const paid = num(w.amountPaid);
  const balance = Math.max(total - paid, 0);
  const balEl = document.getElementById('wizBalance');
  if(balEl) balEl.textContent = inr(balance);
  const statusEl = document.getElementById('wizStatus');
  if(statusEl){
    const st = calcStatus(total, paid);
    statusEl.textContent = st;
    statusEl.className = 'badge ' + statusClass(st);
  }
  const paidOfEl = document.getElementById('wizPaidOfTotal');
  if(paidOfEl) paidOfEl.textContent = 'of ' + inr(total);
}

function renderWizard(){
  const w = UI.wizard;
  const total = calcTotal(w);
  const steps = ['Tenant & Month','Charges','Payment'];
  const stepsHtml = steps.map((s,i)=>`<div class="wizard-step ${w.step===i+1?'active':(w.step>i+1?'done':'')}">${i+1}. ${s}</div>`).join('');

  let body = '';
  if(w.step===1) body = renderWizardStep1();
  else if(w.step===2) body = renderWizardStep2();
  else body = renderWizardStep3();

  return `
    <div class="card" style="padding:24px 26px;max-width:760px;">
      <div class="wizard-steps">${stepsHtml}</div>
      ${body}
    </div>`;
}

  return `

function wizardValidateStep1(){
  const w = UI.wizard;
  if(!w.tenantId){ toast('Please select a tenant.'); return; }
  if(!w.month){ toast('Please select a billing month.'); return; }
  if(!w.periodFrom || !w.periodTo){ toast('Please select both billing period dates.'); return; }
  if(w.periodFrom > w.periodTo){ toast('Period From cannot be after Period To.'); return; }
  const dup = findBillForTenantPeriod(w.tenantId, w.periodFrom, w.periodTo, w.editingBillId);
  if(dup){
    toast('A bill already exists for this tenant & billing period — opening it for edit.');
    openWizard(dup.id);
    return;
  }
  wizardGoStep(2);
}

async function generateBill(){
  if(!requireAdmin('save a bill')) return;
  const w = UI.wizard;
  if(!w.tenantId){ toast('Please select a tenant.'); wizardGoStep(1); return; }
  if(!w.month){ toast('Please select a billing month.'); wizardGoStep(1); return; }
  if(!w.periodFrom || !w.periodTo || w.periodFrom > w.periodTo){ toast('Please select a valid billing period (From and To).'); wizardGoStep(1); return; }
  const tenant = getTenant(w.tenantId);
  if(!tenant){ toast('Selected tenant not found.'); return; }
  const total = calcTotal(w);
  const paid = num(w.amountPaid);
  const balance = Math.max(total-paid,0);
  const status = calcStatus(total, paid);

  let bill;
  if(w.editingBillId){
    bill = getBill(w.editingBillId);
    Object.assign(bill, {
      tenantId:w.tenantId, tenantName:tenant.name, flat:tenant.flat, floor:tenant.floor,
      month:w.month, monthLabel: monthLabel(w.month), periodFrom:w.periodFrom, periodTo:w.periodTo, billDate:w.billDate, dueDate:w.dueDate,
      rent:num(w.rent), electricity:num(w.electricity), maintenance:num(w.maintenance), png:num(w.png),
      other:num(w.other), discount:num(w.discount), total, amountPaid:paid, paymentDate:w.paymentDate,
      paymentMethod:w.paymentMethod, transactionId:w.transactionId, balance, status,
      prevUnit:num(w.prevUnit), currUnit:num(w.currUnit), elecRate:num(w.elecRate)||(DB.settings.elecRatePerUnit||8.5)
    });
    if(status!=='PAID'){ bill.receiptNo=null; bill.receiptDate=null; }
    toast('Bill updated.');
  } else {
    const billNo = genBillNo(w.month);
    bill = {
      id: uid(), billNo, tenantId:w.tenantId, tenantName:tenant.name, flat:tenant.flat, floor:tenant.floor,
      month:w.month, monthLabel: monthLabel(w.month), periodFrom:w.periodFrom, periodTo:w.periodTo, billDate:w.billDate, dueDate:w.dueDate,
      rent:num(w.rent), electricity:num(w.electricity), maintenance:num(w.maintenance), png:num(w.png),
      other:num(w.other), discount:num(w.discount), total, amountPaid:paid, paymentDate:w.paymentDate,
      paymentMethod:w.paymentMethod, transactionId:w.transactionId, balance, status,
      prevUnit:num(w.prevUnit), currUnit:num(w.currUnit), elecRate:num(w.elecRate)||(DB.settings.elecRatePerUnit||8.5),
      receiptNo:null, receiptDate:null, createdAt: Date.now()
    };
    DB.bills.push(bill);
    await saveCounters();
    toast('Bill generated.');
  }
  await saveBills();
  UI.wizard = null;
  openPreview(bill.id, 'bill');
}

/* ============================== EXPORT: PDF / IMAGE / PRINT / WHATSAPP ===== */
function exportDocPdf(elId, filename, paymentInfo){
  const node = document.getElementById(elId);
  if(!node || !window.html2canvas || !window.jspdf){ toast('Export tools still loading — try again in a moment.'); return; }
  toast('Preparing PDF…');

  // Downloaded bill should show only the UPI scanner — hide the "Pay Now" button
  // during capture (it stays visible in the on-screen preview).
  const payBtns = node.querySelectorAll('.doc-payqr-btn');
  const payBtnPrevDisplay = [];
  payBtns.forEach(btn=>{ payBtnPrevDisplay.push(btn.style.display); btn.style.display = 'none'; });

  html2canvas(node, {scale:2, backgroundColor:'#ffffff', useCORS:true}).then(canvas=>{
    payBtns.forEach((btn,i)=>{ btn.style.display = payBtnPrevDisplay[i]; });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = 210, pageH = 297;
    const imgW = pageW;
    const imgH = canvas.height * imgW / canvas.width;
    const imgData = canvas.toDataURL('image/png');
    let lastContentBottom; // mm — y where the rasterized doc content ends on its LAST page
    if(imgH <= pageH){
      pdf.addImage(imgData,'PNG',0,0,imgW,imgH);
      lastContentBottom = imgH;
    } else {
      // paginate tall content
      let heightLeft = imgH, position = 0;
      pdf.addImage(imgData,'PNG',0,position,imgW,imgH);
      heightLeft -= pageH;
      while(heightLeft > 0){
        position = heightLeft - imgH;
        pdf.addPage();
        pdf.addImage(imgData,'PNG',0,position,imgW,imgH);
        heightLeft -= pageH;
      }
      lastContentBottom = pageH + heightLeft; // heightLeft <= 0 here
    }

    // Append a REAL (vector) UPI payment block — a freshly-drawn PNG QR plus an
    // Add a genuine vector PDF hyperlink instead of relying on the rasterized
    // HTML "Pay Now" button. The PDF link uses the same dynamic UPI URI as the
    // QR code and on-screen button.
    // It uses the
    // SAME dynamic upiUri as the on-screen preview (amount + invoice id come straight
    // from the bill object — see getBillPaymentInfo() — nothing hardcoded).
    if(paymentInfo && paymentInfo.upiUri){
      const margin = 14;
      const blockH = 62;
      let y = lastContentBottom + 8;
      if(y + blockH > pageH - 8){ pdf.addPage(); y = 16; }

      pdf.setDrawColor(210,210,210);
      pdf.setLineWidth(0.3);
      pdf.line(margin, y, pageW-margin, y);
      y += 8;

      const qrSizeMm = 32;
      const qrPng = makeUpiQrPngDataUrl(paymentInfo.upiUri, 6, 8);
      if(qrPng) pdf.addImage(qrPng, 'PNG', margin, y, qrSizeMm, qrSizeMm);

      const textX = margin + qrSizeMm + 8;
      let ty = y + 6;
      pdf.setFont(undefined,'bold'); pdf.setFontSize(12); pdf.setTextColor(30,30,30);
      pdf.text('Scan & Pay via UPI', textX, ty); ty += 7;

      pdf.setFont(undefined,'normal'); pdf.setFontSize(10); pdf.setTextColor(60,60,60);
      pdf.text(`Amount Due: Rs. ${Number(paymentInfo.amount).toFixed(2)}`, textX, ty); ty += 6;
      pdf.text(`UPI ID: ${paymentInfo.upiId}`, textX, ty); ty += 6;
      pdf.text(`Invoice No: ${paymentInfo.invoiceId}`, textX, ty); ty += 8;

      // Add a REAL clickable payment link to the PDF. The bill itself is
      // rasterized by html2canvas, so its HTML <a> tag cannot remain clickable.
      // jsPDF annotations are used here so tapping the link in a PDF viewer can
      // hand the UPI URI to the device's payment app.
      const payLabel = 'CLICK HERE TO PAY ONLINE';
      const linkY = ty;
      pdf.setFont(undefined,'bold');
      pdf.setFontSize(11);
      pdf.setTextColor(31, 111, 72);
      if(typeof pdf.textWithLink === 'function'){
        pdf.textWithLink(payLabel, textX, linkY, { url: paymentInfo.upiUri });
      }else{
        pdf.text(payLabel, textX, linkY);
        const linkW = pdf.getTextWidth(payLabel);
        pdf.link(textX, linkY-5, linkW, 6, { url: paymentInfo.upiUri });
      }
      ty += 7;
      pdf.setFont(undefined,'normal');
      pdf.setFontSize(8.5);
      pdf.setTextColor(90,90,90);
      pdf.text('Tap the link above on your phone to open your UPI payment app.', textX, ty);

      pdf.setTextColor(0,0,0);
    }

    pdf.save(filename);
    toast('PDF downloaded.');
  }).catch(err=>{
    payBtns.forEach((btn,i)=>{ btn.style.display = payBtnPrevDisplay[i]; });
    console.error(err); toast('Could not generate PDF.');
  });
}

function exportDocImage(elId, filename){

function normalizePhone(mobile){
  let m = (mobile||'').replace(/\D/g,'');
  if(!m) return '';
  if(m.length===10) return '91'+m;
  if(m.length===12 && m.startsWith('91')) return m;
  if(m.length===11 && m.startsWith('0')) return '91'+m.slice(1);
  return m;
}
function shareWhatsapp(billId, isReceipt){
  const bill = getBill(billId);
  if(!bill) return;
  const tenant = getTenant(bill.tenantId) || {mobile:''};
  const phone = normalizePhone(tenant.mobile);
  let text;
  if(isReceipt){
    text = `Hello ${bill.tenantName},\n\nWe have received your payment for ${monthLabel(bill.month)}.\n\nReceipt No: ${bill.receiptNo}\nAmount Received: ${inrPlain(bill.amountPaid)}\nStatus: PAID\n\nThank you for your timely payment.`;
  } else {
    text = `Hello ${bill.tenantName},\n\nYour Monthly Rent & Utility Bill for ${monthLabel(bill.month)} is ready.\n\nTotal Bill: ${inrPlain(bill.total)}\nAmount Paid: ${inrPlain(bill.amountPaid)}\nBalance Due: ${inrPlain(bill.balance)}\n\nPlease find your bill attached.\n\nThank you.`;
  }
  const url = phone
    ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}`
    : `https://wa.me/?text=${encodeURIComponent(text)}`;
  if(!phone) toast('No mobile number on file — opening WhatsApp without a specific contact.');
  window.open(url, '_blank');
}

function filteredBills(){
  const q = UI.billsSearch.trim().toLowerCase();
  return DB.bills.filter(b=>{
    if(UI.billsStatus!=='all' && b.status!==UI.billsStatus) return false;
    if(!q) return true;
    return (b.tenantName||'').toLowerCase().includes(q) ||
           (b.flat||'').toLowerCase().includes(q) ||
           (b.billNo||'').toLowerCase().includes(q) ||
           (monthLabel(b.month).toLowerCase().includes(q) || formatBillingPeriod(b.periodFrom || firstDayOfMonth(b.month), b.periodTo || lastDayOfMonth(b.month)).toLowerCase().includes(q));
  }).sort((a,b)=> (b.month.localeCompare(a.month)) || (b.billNo||'').localeCompare(a.billNo||''));
}
function renderBillsTable(){
  const bills = filteredBills();
  const rows = bills.length ? bills.map(b=>`
    <tr>
      <td class="mono">${b.billNo}</td>
      <td>${monthLabelShort(b.month)}</td>
      <td>${esc(b.tenantName)}</td>
      <td>${esc(b.flat)}</td>
      <td class="num">${inr(b.total)}</td>
      <td class="num">${inr(b.amountPaid)}</td>
      <td class="num">${inr(b.balance)}</td>
      <td><span class="badge ${statusClass(b.status)}">${b.status}</span></td>
      <td>
        <div class="action-row">
          <button class="icon-btn" title="View" onclick="openPreview('${b.id}','bill')">${icon('eye',15)}</button>
          ${isAdmin() ? `<button class="icon-btn" title="Edit" onclick="openWizard('${b.id}')">${icon('edit',15)}</button>` : ''}
          <button class="icon-btn" title="Download PDF" onclick="quickPdf('${b.id}')">${icon('download',15)}</button>
          ${isAdmin() && b.status!=='PAID' ? `<button class="icon-btn" title="Payment Done" style="color:var(--success);border-color:var(--success-bg);" onclick="openPaymentModal('${b.id}')">${icon('check',15)}</button>` : ''}
          ${b.status==='PAID' ? `<button class="icon-btn" title="Receipt" onclick="generateReceipt('${b.id}')">${icon('receipt',15)}</button>` : ''}
          <button class="icon-btn" title="WhatsApp" onclick="shareWhatsapp('${b.id}')">${icon('whatsapp',15)}</button>
        </div>
      </td>
    </tr>`).join('') : `<tr class="empty-row"><td colspan="9">No bills match your search or filter.</td></tr>`;
  return `
  <div class="card table-wrap">
    <table class="data">
      <thead><tr><th>Bill No.</th><th>Month</th><th>Tenant</th><th>Flat</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}
function onBillsSearch(v){
  UI.billsSearch = v;
  document.getElementById('billsTableContainer').innerHTML = renderBillsTable();
}
function setBillsFilter(status){
  UI.billsStatus = status;
  render();
}
function quickPdf(billId){
  openPreview(billId,'bill');
  setTimeout(()=>{ exportBillPdf(billId); }, 60);
}

/* ============================== REPORTS =================================== */
function renderReports(){
  const months = monthsWithData();
  if(!months.includes(UI.reportsMonth)) months.unshift(UI.reportsMonth);
  const bills = billsForMonth(UI.reportsMonth);
  const sum = f => bills.reduce((s,b)=>s+num(b[f]),0);
  const totalRent = sum('rent'), totalElec = sum('electricity'), totalPng = sum('png'), totalMaint = sum('maintenance'), totalOther = sum('other');
  const totalBilling = bills.reduce((s,b)=>s+b.total,0);
  const totalCollected = bills.reduce((s,b)=>s+num(b.amountPaid),0);
  const totalPending = bills.reduce((s,b)=>s+Math.max(b.balance,0),0);
  const paidTenants = bills.filter(b=>b.status==='PAID');
  const pendingTenants = bills.filter(b=>b.status==='PENDING');
  const partialTenants = bills.filter(b=>b.status==='PARTIALLY PAID');
  const monthOptions = months.map(m=>`<option value="${m}" ${m===UI.reportsMonth?'selected':''}>${monthLabel(m)}</option>`).join('');

  const tenantListHtml = (list, cls) => list.length ? `<ul style="margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.9;">${list.map(b=>`<li>${esc(b.tenantName)} <span style="color:var(--slate-light);">— Flat ${esc(b.flat)}</span></li>`).join('')}</ul>` : `<div class="hint">None</div>`;

  return `
  <div class="section-head"><div></div><select onchange="UI.reportsMonth=this.value; render();">${monthOptions}</select></div>
  <div id="reportPrintable">
  <div class="card" style="padding:24px 26px;margin-bottom:20px;" id="reportDoc">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px;">
      <div>
        <div class="serif" style="font-size:20px;font-weight:700;">${esc(DB.settings.propertyName||'Property')}</div>
        <div style="font-size:12px;color:var(--brass);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;margin-top:4px;">Monthly Collection Report</div>
      </div>
      <div style="text-align:right;font-size:13px;color:var(--slate);">${monthLabel(UI.reportsMonth)}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;">
      <div class="calc-line"><span>Total Rent</span><span class="amt">${inr(totalRent)}</span></div>
      <div class="calc-line"><span>Total Electricity</span><span class="amt">${inr(totalElec)}</span></div>
      <div class="calc-line"><span>Total PNG</span><span class="amt">${inr(totalPng)}</span></div>
      <div class="calc-line"><span>Total Maintenance</span><span class="amt">${inr(totalMaint)}</span></div>
      <div class="calc-line"><span>Total Other Charges</span><span class="amt">${inr(totalOther)}</span></div>
      <div class="calc-line"><span>Total Billing</span><span class="amt"><strong>${inr(totalBilling)}</strong></span></div>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:6px;">
      <div class="card stat-card acc-success"><div class="bar"></div><div class="label">Total Collected</div><div class="value small">${inr(totalCollected)}</div></div>
      <div class="card stat-card acc-rust"><div class="bar"></div><div class="label">Total Pending</div><div class="value small">${inr(totalPending)}</div></div>
      <div class="card stat-card acc-brass"><div class="bar"></div><div class="label">Bills Generated</div><div class="value">${bills.length}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px;">
      <div><div class="doc-section-title" style="margin-top:0;">Paid Tenants (${paidTenants.length})</div>${tenantListHtml(paidTenants)}</div>
      <div><div class="doc-section-title" style="margin-top:0;">Partially Paid (${partialTenants.length})</div>${tenantListHtml(partialTenants)}</div>
      <div><div class="doc-section-title" style="margin-top:0;">Pending Tenants (${pendingTenants.length})</div>${tenantListHtml(pendingTenants)}</div>
    </div>
  </div>
  </div>
  <div style="display:flex;gap:10px;">
    <button class="btn btn-primary" onclick="exportDocPdf('reportDoc','Collection-Report-${UI.reportsMonth}.pdf')">${icon('download',15)} Download PDF Report</button>
    <button class="btn" onclick="printReport()">${icon('printer',15)} Print Report</button>
    <button class="btn" onclick="exportCsv()">${icon('file',15)} Export CSV</button>
  </div>`;
}
function printReport(){
  document.getElementById('reportPrintable').id = 'printable';
  window.print();
  setTimeout(()=>{ const el=document.getElementById('printable'); if(el) el.id='reportPrintable'; }, 300);
}
function exportCsv(){
  const bills = billsForMonth(UI.reportsMonth);
  const header = ['Bill No','Month','Tenant','Flat','Floor','Rent','Electricity','Maintenance','PNG','Other','Discount','Total','Amount Paid','Balance','Status','Payment Date','Payment Method','Transaction ID'];
  const lines = [header.join(',')];
  bills.forEach(b=>{
    const row = [b.billNo, monthLabel(b.month), b.periodFrom||firstDayOfMonth(b.month), b.periodTo||lastDayOfMonth(b.month), b.tenantName, b.flat, b.floor, b.rent, b.electricity, b.maintenance, b.png, b.other, b.discount, b.total, b.amountPaid, b.balance, b.status, b.paymentDate||'', b.paymentMethod||'', b.transactionId||''];
    lines.push(row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Collection-Report-${UI.reportsMonth}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exported.');
}

/* ============================== SETTINGS =================================== */
function renderSettings(){
  const s = DB.settings;
  const ro = isAdmin() ? '' : ' readonly';
  return `
  <div class="card" style="padding:24px 26px;max-width:680px;">
    <div class="field"><label>Property / Building Name</label><input id="s_name" value="${esc(s.propertyName)}"${ro}/></div>
    <div class="field"><label>Property Address</label><textarea id="s_addr" rows="2"${ro}>${esc(s.address)}</textarea></div>
    <div class="field-row">
      <div class="field"><label>Owner Name</label><input id="s_owner" value="${esc(s.ownerName)}"${ro}/></div>
      <div class="field"><label>Manager Name</label><input id="s_manager" value="${esc(s.managerName)}"${ro}/></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Manager Phone Number</label><input id="s_phone" value="${esc(s.managerPhone)}"${ro}/></div>
      <div class="field"><label>UPI ID</label><input id="s_upi" value="${esc(s.upiId)}"${ro}/></div>
    </div>
    <div class="field"><label>Bank Details</label><textarea id="s_bank" rows="2"${ro}>${esc(s.bankDetails)}</textarea></div>
    <div class="field-row">
      <div class="field"><label>Default Due Date <span style="font-weight:400;color:var(--slate-light);">(days after bill date)</span></label><input id="s_due" value="${s.dueDateDays}"${ro}/></div>
      <div class="field"><label>Electricity Rate <span style="font-weight:400;color:var(--slate-light);">(₹ per unit)</span></label>
        <div class="currency-input"><span class="rupee">₹</span><input id="s_elecrate" value="${s.elecRatePerUnit!==undefined?s.elecRatePerUnit:8.5}"${ro}/></div>
      </div>
    </div>
    <div class="field"><label>Payment Instructions</label><textarea id="s_instr" rows="2"${ro}>${esc(s.paymentInstructions)}</textarea></div>
    ${isAdmin() ? `<button class="btn btn-primary" onclick="saveSettingsForm()">${icon('check',15)} Save Settings</button>` : `<div class="muted" style="margin-top:10px;">You can manage settings with your account.</div>`}
  </div>
  <div class="card" style="padding:24px 26px;max-width:680px;margin-top:18px;">
    <div class="section-head" style="margin-bottom:8px;"><h2 style="font-size:16px;">Data Backup &amp; Safety</h2></div>
    <p style="font-size:13px;color:var(--slate);margin:0 0 14px;">Every tenant and every month's bill record is saved automatically to the shared cloud and this device/browser. Changes made by you or the owner sync automatically. Download a backup file regularly as an extra safety copy.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="exportBackup()">${icon('download',15)} Download Backup (JSON)</button>
      ${isAdmin() ? `<button class="btn" onclick="triggerImportBackup()">${icon('file',15)} Restore from Backup</button>` : ''}
    </div>
    <input type="file" id="backupFileInput" accept="application/json,.json" style="display:none" onchange="importBackupFile(this)"/>
  </div>
  <div class="card" style="padding:24px 26px;max-width:680px;margin-top:18px;border-color:#EAD3CC;">
    <div class="section-head" style="margin-bottom:8px;"><h2 style="font-size:16px;color:var(--rust);">Danger Zone</h2></div>
    <p style="font-size:13px;color:var(--slate);margin:0 0 14px;">Remove every tenant and every saved bill so you can start completely fresh. Your property settings above will not be affected.</p>
    ${isAdmin() ? `<button class="btn btn-danger" onclick="askClearAllData()">${icon('trash',15)} Clear All Tenants &amp; Bills</button>` : `<div class="muted">Sign in to manage this section.</div>`}
  </div>`;
}
async function saveSettingsForm(){
  if(!requireAdmin('change settings')) return;
  DB.settings = {
    propertyName: document.getElementById('s_name').value.trim() || 'Property',
    address: document.getElementById('s_addr').value.trim(),
    ownerName: document.getElementById('s_owner').value.trim(),
    managerName: document.getElementById('s_manager').value.trim(),
    managerPhone: document.getElementById('s_phone').value.trim(),
    upiId: document.getElementById('s_upi').value.trim(),
    bankDetails: document.getElementById('s_bank').value.trim(),
    dueDateDays: num(document.getElementById('s_due').value) || 7,
    paymentInstructions: document.getElementById('s_instr').value.trim(),
    elecRatePerUnit: num(document.getElementById('s_elecrate').value) || 8.5
  };
  await saveSettings();
  toast('Settings saved.');
  render();
}
</script>
</body>
</html>
